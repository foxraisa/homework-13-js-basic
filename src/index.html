<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер параграфов</title>
    <meta name="description" content="Простое приложение для управления текстовыми параграфами">
</head>
<body>
    <div class="container">
        <h1>📝 Менеджер параграфов</h1>
       
        <div class="input-group">
            <input type="text" id="textInput" placeholder="Введите текст для нового параграфа...">
            <button id="addButton" disabled>Добавить параграф</button>
        </div>
       
        <div id="errorMessage" class="error-message" style="display: none;"></div>
       
        <div class="paragraphs-container" id="paragraphsContainer">
            <p>Добро пожаловать в менеджер параграфов!</p>
            <p>Добавляйте новые текстовые блоки с помощью формы выше.</p>
            <p>Старые параграфы автоматически удаляются при превышении лимита.</p>
        </div>
       
        <div class="counter">
            Параграфов: <span id="counter">3</span>
            <div class="limit-info">(максимум 5)</div>
        </div>
    </div>
</body>
</html>
